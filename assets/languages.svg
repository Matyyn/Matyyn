<svg fill="none" viewBox="0 0 440 205" width="440" height="205" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #38bdf8; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #94a3b8; }
    .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #e2e8f0; }
    .lang-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 10.5px; fill: #94a3b8; }
  </style>

  <!-- Card Background -->
  <rect x="1" y="1" width="438" height="203" rx="12" fill="url(#langBg)" stroke="url(#langBorder)" stroke-width="1.5" />

  <!-- Header -->
  <text x="22" y="32" class="title">Active Languages &amp; Ecosystems</text>
  <text x="22" y="48" class="subtitle">Public + Private 2026 Engineering Stack</text>
  <line x1="22" y1="60" x2="418" y2="60" stroke="#334155" stroke-width="1" />

  <!-- Multi-segment Bar -->
  <g transform="translate(22, 72)">
    <rect x="0" y="0" width="396" height="9" rx="4.5" fill="#1e293b" />
    <rect x="0" y="0" width="125" height="9" rx="4.5" fill="#3178c6" />
    <rect x="122" y="0" width="105" height="9" fill="#0175c2" />
    <rect x="227" y="0" width="75" height="9" fill="#f7df1e" />
    <rect x="302" y="0" width="52" height="9" fill="#7f52ff" />
    <rect x="354" y="0" width="42" height="9" rx="4.5" fill="#3776ab" />
  </g>

  <!-- Language Rows -->
  <g transform="translate(22, 102)">
    <!-- Row 1 -->
    <circle cx="6" cy="-4" r="5" fill="#3178c6" />
    <text x="18" y="0" class="lang-name">TypeScript / JS</text>
    <text x="155" y="0" class="lang-desc">Next.js, React Native, Node.js, Electron</text>

    <!-- Row 2 -->
    <circle cx="6" cy="20" r="5" fill="#0175c2" />
    <text x="18" y="24" class="lang-name">Dart / Flutter</text>
    <text x="155" y="24" class="lang-desc">SwapScroll, Fluffy Merge, Word Game, POS</text>

    <!-- Row 3 -->
    <circle cx="6" cy="44" r="5" fill="#7f52ff" />
    <text x="18" y="48" class="lang-name">Kotlin / Java</text>
    <text x="155" y="48" class="lang-desc">StartNow, Arbitrage Client, Android NDK</text>

    <!-- Row 4 -->
    <circle cx="6" cy="68" r="5" fill="#3776ab" />
    <text x="18" y="72" class="lang-name">Python / AI</text>
    <text x="155" y="72" class="lang-desc">OpenAI Assistants, IoT / MQTT Automation</text>

    <!-- Row 5 -->
    <circle cx="6" cy="92" r="5" fill="#2dd4bf" />
    <text x="18" y="96" class="lang-name">Databases &amp; Web3</text>
    <text x="155" y="96" class="lang-desc">PostgreSQL, MongoDB, SQLite, Ethers.js</text>
  </g>
</svg>
